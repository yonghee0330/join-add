<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="6; url=https://bbooks.co.kr/" />
  <title>비북스 파트너 모집 마감</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1a1a1a; --mid: #5a5a5a; --faint: #d4cfc9; --paper: #f9f7f4; --serif: 'Noto Serif KR', Georgia, serif; --sans: 'Noto Sans KR', system-ui, sans-serif; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.75; min-height: 100vh; display: grid; place-items: center; padding: 48px 24px; }
    main { max-width: 460px; width: 100%; display: grid; gap: 18px; }
    .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--mid); }
    h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.4; word-break: keep-all; }
    p { color: var(--mid); word-break: keep-all; }
    hr { border: 0; border-top: 1px solid var(--faint); }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn { display: inline-block; padding: 11px 18px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font-size: 14px; }
    a.btn.primary { background: var(--ink); color: var(--paper); }
    a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    small { font-size: 12.5px; color: var(--mid); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">B.BOOKS · 0.1평 서점</div>
    <h1>비북스 파트너 모집이 마감되었어요</h1>
    <p>0.1평 서가 점주 추가 모집에 관심 가져 주셔서 고맙습니다. 남은 자리가 모두 채워져 지금은 신청을 받지 않아요.</p>
    <p>지금 비북스에서 만날 수 있는 0.1평 서점들은 홈페이지에서 둘러보실 수 있어요. 다음 모집 소식도 홈페이지와 인스타그램으로 알려 드릴게요.</p>
    <hr />
    <div class="btns">
      <a class="btn primary" href="https://bbooks.co.kr/">비북스 홈으로</a>
      <a class="btn" href="https://bbooks.co.kr/stores.html">0.1평 서점 둘러보기</a>
    </div>
    <small>잠시 후 비북스 홈으로 이동해요.</small>
  </main>
</body>
</html>
